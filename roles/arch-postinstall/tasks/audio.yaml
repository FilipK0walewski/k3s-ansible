- name: Install PipeWire audio stack
  pacman:
    name:
      - pipewire
      - pipewire-alsa
      - pipewire-pulse
      - wireplumber
      - alsa-utils
      - pamixer
      - pavucontrol
    state: present

- name: Enable PipeWire services for user
  systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
  loop:
    - pipewire
    - pipewire-pulse
    - wireplumber
  become_user: "{{ user }}"
