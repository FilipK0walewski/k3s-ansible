- name: Ensure source directory exists
  file:
    path: "{{ src_dir }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"

- name: Clone st repo
  git:
    repo: "{{ st_repo }}"
    dest: "{{ src_dir }}/st"
    version: master
  become_user: "{{ user }}"

- name: Copy st patches
  copy:
    src: "patches/st/{{ item }}"
    dest: "{{ src_dir }}/st/{{ item }}"
  loop: "{{ st_patches }}"
  when: st_patches | length > 0

- name: Apply st patches idempotently
  shell: |
    grep -q "{{ item }}" .applied_patches 2>/dev/null && exit 0
    patch -p1 < {{ item }}
    echo "{{ item }}" >> .applied_patches
  args:
    chdir: "{{ src_dir }}/st"
  become_user: "{{ user }}"
  loop: "{{ st_patches }}"
  when: st_patches | length > 0

- name: Build st
  shell: make clean all
  args:
    chdir: "{{ src_dir }}/st"
  become_user: "{{ user }}"

- name: Install st
  make:
    chdir: "{{ src_dir }}/st"
    target: install
